# Portal configuration for the NGIAB Visualizer image.
#
# Replaces the config the old image generated at runtime via salt. tethys-uvx copies this
# to /config/portal_config.yml and portal-config.sh renders it at container start, merging
# in deploy-time values (PORTAL_ALLOWED_HOSTS, and anything exported by the hooks in
# /opt/portal/portal-config.d/).
#
# DEBUG drives serving mode in serve.sh: false runs uvicorn, which is what ships. Static is
# served by tethysapp.ngiab.static_urls, wired in through ADDITIONAL_URLPATTERNS below.

version: 2.0
name: NGIAB Visualizer

apps: {}

settings:
  # Registers the app as a real Django app so it can own models and migrations.
  # tethys_portal merges this with its own list rather than replacing it
  # (tethys_portal/settings.py: INSTALLED_APPS + portal_config INSTALLED_APPS), and Tethys's
  # normal app discovery does NOT put apps here -- it loads them dynamically for routing
  # only, which is why models would otherwise be invisible to Django.
  INSTALLED_APPS:
    - tethysapp.ngiab

  # serve.sh branches on this: false runs uvicorn, true runs Django's dev server. False was
  # not previously possible, because there is no nginx under tethys-uvx and upstream expects
  # a CDN, so nothing answered /static/. tethysapp.ngiab.static_urls now does, which buys
  # three things at once: `docker stop` no longer takes ten seconds waiting on the dev
  # server's autoreloader, the server no longer restarts whenever a file is touched, and the
  # Apptainer image no longer trips over the autoreloader globbing an unreadable path.
  DEBUG: false

  # Declared explicitly rather than left to TETHYS_DB_NAME: the settings module does not
  # read that env var, so without this block Tethys falls back to its sqlite default at
  # ${TETHYS_HOME}/tethys_platform.sqlite -- which is inside the image's writable layer,
  # not the baked location the runtime stage copies.
  DATABASES:
    default:
      ENGINE: django.db.backends.sqlite3
      NAME: /home/tethys/ngiab/tethys_platform.sqlite

  # Merged with PORTAL_ALLOWED_HOSTS by portal-config.sh. Localhost entries are the
  # default single-container case; viewOnTethys.sh adds the host's own IPv4 addresses so
  # the portal is reachable from the LAN / the WSL host.
  ALLOWED_HOSTS:
    - localhost
    - 127.0.0.1

  # No CSRF_TRUSTED_ORIGINS. This is a local tool reached directly at localhost or the
  # host's own address, so the browser's Origin always matches the Host Django sees and the
  # setting is never consulted. It was needed under the pre-uvx image, where nginx proxied
  # to a different internal port and the two disagreed.

  SESSION_EXPIRE_AT_BROWSER_CLOSE: false

  # Baked at build time, deliberately outside ${TETHYS_PERSIST} -- that path is a declared
  # VOLUME in the base image, so anything written there can be masked by a user bind mount.
  # Under the runtime user's home rather than /opt: /opt is a system location by convention,
  # and this is application data owned by uid 1000.
  STATIC_ROOT: /home/tethys/ngiab/static

  # The visualizer is a local, single-user tool; the sign-up flow is not wanted.
  TETHYS_PORTAL_CONFIG:
    ENABLE_OPEN_SIGNUP: false
    # Open portal: Tethys's login_required decorator passes straight through, so the viewer
    # and its endpoints are reachable without signing in. This is a local, single-purpose
    # viewer of model output the user already has on disk, and a login screen in front of it
    # is friction rather than protection. Django's own admin stays authenticated.
    # Reads are open; writes are not. removeModelRun and the upload endpoint carry Django's
    # own login_required, because Tethys's passes straight through when this is true.
    # removeModelRun now deletes the run's directory, so signing in is what stands between
    # a visitor and someone's model output. Still: do not expose this port to a network you
    # do not trust.
    ENABLE_OPEN_PORTAL: true
    # Single-app mode: this image ships exactly one app, so the portal's app library and the
    # /apps/<name>/ prefix are pure overhead. The app is served at /, and Tethys sets
    # BYPASS_TETHYS_HOME_PAGE itself. The frontend reads its root from the template, which
    # reverses the url rather than assuming a prefix, so both modes work.
    MULTIPLE_APP_MODE: false
    STANDALONE_APP: ngiab
    # Serves STATIC_ROOT now that DEBUG is false; see tethysapp/ngiab/static_urls.py for
    # why this rather than whitenoise, and when to switch.
    ADDITIONAL_URLPATTERNS:
      - tethysapp.ngiab.static_urls.urlpatterns
