{% load static tethys %}
<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#2c3e50" />
		<link rel="shortcut icon" href="{% if site_globals.favicon and 'http' in site_globals.favicon %}{{ site_globals.favicon }}{% elif site_globals.favicon %}{% static site_globals.favicon %}{% else %}{% static 'tethys_portal/images/default_favicon.png' %}{% endif %}" />
		<title>{{ tethys_app.name }}</title>
	</head>
	<body style="margin: 0;">
		<noscript>You need to enable JavaScript to run this app.</noscript>
		<div id="root"></div>
		<!-- Legacy React bundle. public/frontend/ is now hand-authored vanilla-JS source, so
		     webpack writes to public/react-build/. Phase 0 Task 11 replaces this whole template
		     with the vanilla frontend's import map + module script. -->
		<script src="{% static tethys_app|public:'react-build/main.js' %}"></script>
	</body>
</html>
