name: tests

# Callable, so the image builds can gate on it rather than duplicating it.
on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No lockfile is committed, and the only dev dependencies are the test runner itself.
      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      # @web/test-runner drives a real Chromium through the puppeteer launcher, which is
      # what the tests are written against -- the DOM behaviour they pin down (feature-state,
      # ResizeObserver, custom elements) is not reproducible under jsdom.
      - name: Run the frontend test suite
        run: npm run test:frontend

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # No Django test suite yet, so this is a syntax and import-shape gate: it catches the
      # dangling import or stray reference that a refactor leaves behind, which is exactly
      # what broke during the DataStream removal.
      - name: Byte-compile the app
        run: python -m compileall -q tethysapp/

      - name: Check for imports of removed modules
        run: |
          set -e
          for gone in datastream_utils reactapp; do
            if grep -rn "\b${gone}\b" --include='*.py' tethysapp/; then
              echo "::error::tethysapp still references removed module: ${gone}"
              exit 1
            fi
          done
          echo "no references to removed modules"

  comment-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Docstrings may be any length; an aside inside a function body may not. Enforced
      # because it drifted back by hand twice.
      - name: Comment style
        run: python scripts/check-comment-style.py

      # The two dark blocks cannot share a declaration list, so a token added to one and
      # not the other renders light down that path.
      - name: Theme tokens
        run: python scripts/check-theme-tokens.py
