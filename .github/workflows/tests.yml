name: tests

# Callable, so the image builds can gate on it rather than duplicating it.
on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No lockfile is committed, and the only dev dependencies are the test runner itself.
      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      # @web/test-runner drives a real Chromium through the puppeteer launcher, which is
      # what the tests are written against -- the DOM behaviour they pin down (feature-state,
      # ResizeObserver, custom elements) is not reproducible under jsdom.
      - name: Run the frontend test suite
        run: npm run test:frontend

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # No Django test suite yet, so this is a syntax and import-shape gate: it catches the
      # dangling import or stray reference that a refactor leaves behind, which is exactly
      # what broke during the DataStream removal.
      - name: Byte-compile the app
        run: python -m compileall -q tethysapp/

      # compileall accepts a name that does not exist anywhere, which is how a constant
      # referenced but never defined reached a release and emptied the T-Route tab.
      - name: Undefined names
        run: |
          pip install pyflakes
          python -m pyflakes tethysapp/

      # Matches the bare name, so `from .models import ModelRun` is caught as well as
      # `from tethysapp.ngiab.models import ModelRun`. A dotted-path pattern misses the
      # relative form, which is the form this app actually uses -- utils.py and controllers.py
      # both import that way, so a dotted guard would pass on a broken tree.
      - name: Check for imports of removed modules
        run: |
          set -e
          for gone in datastream_utils reactapp; do
            if grep -rn "\b${gone}\b" --include='*.py' tethysapp/; then
              echo "::error::tethysapp still references removed module: ${gone}"
              exit 1
            fi
          done
          echo "no references to removed modules"

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools-scm derives the version from git metadata, which the image build needs.
          fetch-depth: 0

      # Tests run inside the image, not in a pip or conda environment assembled here. The
      # base image installs tethys-platform from git main, so any environment built
      # separately is a different Tethys than the one that ships -- a suite green against it
      # proves less than it looks like it does. The test stage stops short of the runtime
      # stage, so this reuses the builder layers the image build already produces.
      - name: Build the test image
        run: docker build --target test -t ngiab-visualizer:test .

      # The count assertion is the point of this step. pytest exits 0 when every test skips,
      # and the existing TEEHR suite skips 19 of 28 without its fixture warehouse -- so "the
      # suite passed" and "the suite ran" are different claims, and only the second one is
      # worth gating on. The parity suite generates its own fixtures and must never skip.
      - name: Run the suite, and prove it actually ran
        run: |
          docker run --rm ngiab-visualizer:test /bin/sh -c '
            set -e
            "${VIRTUAL_ENV}/bin/python" -m pytest \
              -p no:cacheprovider --no-cov \
              --junit-xml=/tmp/report.xml
            "${VIRTUAL_ENV}/bin/python" - <<PYCHECK
          import sys, xml.etree.ElementTree as ET

          suite = ET.parse("/tmp/report.xml").getroot().find("testsuite")
          total = int(suite.get("tests", 0))
          skipped = int(suite.get("skipped", 0))
          executed = total - skipped
          print(f"collected {total}, skipped {skipped}, executed {executed}")
          if executed == 0:
              sys.exit("::error::every test skipped -- the suite proved nothing")
          PYCHECK
          '

  comment-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Docstrings may be any length; an aside inside a function body may not. Enforced
      # because it drifted back by hand twice.
      - name: Comment style
        run: python scripts/check-comment-style.py

      # The two dark blocks cannot share a declaration list, so a token added to one and
      # not the other renders light down that path.
      - name: Theme tokens
        run: python scripts/check-theme-tokens.py

      # The table in DESIGN.md was wrong and the wrongness is what hid a failing role.
      - name: Contrast
        run: python scripts/check-contrast.py
