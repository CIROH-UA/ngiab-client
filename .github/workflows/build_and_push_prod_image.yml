name: build_push_prod_image

on:
  push:
    tags: ['*']

env:
  REGISTRY_IMAGE: awiciroh/tethys-ngiab

permissions:
  contents: read
  security-events: write

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  build:
    needs: [test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # amd64 only: ghcr.io/aquaveo/tethys-uvx publishes no arm64 manifest, so an
        # arm64 build cannot resolve its own base and has been failing since the move
        # to that base. Add linux/arm64 back when the upstream tag ships it.
        platform: [linux/amd64]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=ref,event=tag          # e.g. v1.4.2
            type=raw,value=latest       # extra tag
          labels: |
            maintainer=CIROH-UA

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_BUILDER_USERNAME }}
          password: ${{ secrets.DOCKER_BUILDER_TOKEN }}

      - name: Build & push image by digest (per-arch)
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: false

      - name: Set safe file name
        id: plat
        run: echo "SAFE=$(echo '${{ matrix.platform }}' | tr '/' '-')" >> "$GITHUB_ENV"

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          echo "${digest}" > "/tmp/digests/${SAFE}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.SAFE }}
          path: /tmp/digests/${{ env.SAFE }}
          if-no-files-found: error
          retention-days: 1

  scan:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download amd64 digest
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          name: digests-linux-amd64

      - name: Get amd64 digest
        id: amd64-digest
        run: |
          digest_file=$(ls /tmp/digests)
          digest_value=$(cat "/tmp/digests/${digest_file}")
          echo "digest_file=${digest_file}" >> $GITHUB_OUTPUT
          echo "digest=${digest_value#sha256:}" >> $GITHUB_OUTPUT

      - name: Checkout
        uses: actions/checkout@v4

        with:

          fetch-depth: 0

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_BUILDER_USERNAME }}
          password: ${{ secrets.DOCKER_BUILDER_TOKEN }}

      - name: Scan image with Grype
        id: grype-scan
        continue-on-error: true
        uses: anchore/scan-action@v7
        env:
          GRYPE_CONFIG: .github/security/.grype.yaml
        with:
          image: ${{ env.REGISTRY_IMAGE }}@sha256:${{ steps.amd64-digest.outputs.digest }}
          only-fixed: true
          severity-cutoff: high
          output-format: sarif

      - name: Upload Anchore scan SARIF report
        if: ${{ always() && steps.grype-scan.outputs.sarif != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.grype-scan.outputs.sarif }}

      - name: Inspect action SARIF report
        if: ${{ always() && steps.grype-scan.outputs.sarif != '' }}
        run: cat ${{ steps.grype-scan.outputs.sarif }}

      - name: Fail job if Grype found issues or errored
        if: ${{ steps.grype-scan.outcome == 'failure' }}
        run: |
          echo "Grype scan failed (vulnerabilities or error). Failing job so manifests and tags are not created."
          exit 1

  merge:
    runs-on: ubuntu-latest
    needs: scan   # <- only push/tag the manifest if scan job succeeded

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Docker meta (same rules)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_BUILDER_USERNAME }}
          password: ${{ secrets.DOCKER_BUILDER_TOKEN }}

      - name: Create and push manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -r '.tags[] | "-t " + .' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(for d in * ; do echo "${{ env.REGISTRY_IMAGE }}@$(cat "$d")" ; done)

      - name: Inspect final image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ github.ref_name }}
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:latest
