name: Build Apptainer image

on:
  push:
    branches: [main]
    paths:
      - 'apptainer/**'
      - 'scripts/**'
      - 'conf/**'
      - 'tethysapp/**'
      - 'pyproject.toml'
  pull_request:
    branches: [main]
    paths:
      - 'apptainer/**'
      - 'scripts/**'
      - 'conf/**'
      - 'tethysapp/**'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Apptainer
        uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: 1.3.6

      - name: Build the image
        run: apptainer build --fakeroot ngiab.sif apptainer/ngiab.def

      - name: Verify it starts and serves
        run: |
          export NGIAB_STATE_DIR="${RUNNER_TEMP}/ngiab-state"
          APPTAINERENV_PORT=8080 apptainer run ngiab.sif &
          for _ in $(seq 1 60); do
            code=$(curl -s -m 5 -o /dev/null -w '%{http_code}' http://localhost:8080/ || true)
            [ "$code" = "200" ] && { echo "serving: HTTP $code"; break; }
            sleep 5
          done
          test "$(curl -s -m 10 -o /dev/null -w '%{http_code}' http://localhost:8080/)" = "200"
          curl -s -m 10 http://localhost:8080/getModelRuns/ | grep -q model_runs

          expected="${NGIAB_STATE_DIR}/ngiab_visualizer"
          actual=$(apptainer exec --env TETHYS_PERSIST="$NGIAB_STATE_DIR" ngiab.sif \
            /opt/conda/envs/tethys/bin/python -c \
            'import os,django;os.environ.setdefault("DJANGO_SETTINGS_MODULE","tethys_portal.settings");django.setup();from tethysapp.ngiab import run_store;print(run_store.local_root())')
          echo "runs root: $actual"
          test "$actual" = "$expected"
          test -d "$actual"
          echo "state directory contents:"; find "$NGIAB_STATE_DIR" -maxdepth 2

      - name: Upload the image as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ngiab-apptainer-sif
          path: ngiab.sif
          retention-days: 14

      - name: Publish to GitHub Packages
        if: github.event_name != 'pull_request'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          package="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')/apptainer"
          printf '%s' "$REGISTRY_TOKEN" \
            | apptainer registry login --username "${{ github.actor }}" --password-stdin oras://ghcr.io

          apptainer push ngiab.sif "oras://${package}:latest"
          apptainer push ngiab.sif "oras://${package}:$(git rev-parse --short HEAD)"
          echo "published oras://${package}:latest"

      - name: Say how to pull it
        if: github.event_name != 'pull_request'
        run: |
          package="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')/apptainer"
          {
            echo "### Apptainer image published"
            echo
            echo '```'
            echo "apptainer pull ngiab.sif oras://${package}:latest"
            echo "apptainer run ngiab.sif"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
