name: Build Apptainer image

on:
  push:
    branches: [main, feature/vanilla-js-migration]
    paths:
      - 'apptainer/**'
      - 'scripts/ngiab-apptainer-run.sh'
      - 'conf/**'
      - 'tethysapp/**'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # setuptools-scm derives the version from git metadata, so the build needs history.
          fetch-depth: 0

      - name: Install Apptainer
        uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: 1.3.6

      # --fakeroot rather than sudo: the def file needs no privileged operation, and the
      # runner's user namespace is enough to build it.
      - name: Build the image
        run: apptainer build --fakeroot ngiab.sif apptainer/ngiab.def

      # A def file that builds is not a def file that runs. This is the check the old
      # Singularity workflow never had.
      - name: Verify it starts and serves
        run: |
          export NGIAB_STATE_DIR="${RUNNER_TEMP}/ngiab-state"
          APPTAINERENV_PORT=8080 apptainer run ngiab.sif &
          for _ in $(seq 1 60); do
            code=$(curl -s -m 5 -o /dev/null -w '%{http_code}' http://localhost:8080/ || true)
            [ "$code" = "200" ] && { echo "serving: HTTP $code"; break; }
            sleep 5
          done
          test "$(curl -s -m 10 -o /dev/null -w '%{http_code}' http://localhost:8080/)" = "200"
          curl -s -m 10 http://localhost:8080/getModelRuns/ | grep -q model_runs
          echo "state directory contents:"; find "$NGIAB_STATE_DIR" -maxdepth 2

      - name: Upload the image
        uses: actions/upload-artifact@v4
        with:
          name: ngiab-apptainer-sif
          path: ngiab.sif
          retention-days: 14
